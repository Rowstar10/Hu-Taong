name: Windows build

# Builds Hu Taong's Windows version, the zip release.py publishes, and tries it: unzips it, starts
# it, closes its window and checks its settings were saved to %APPDATA% (release/try-build.ps1).
# Run it by hand (Actions > Windows build > Run workflow) for any commit or tag; it also runs when
# the build recipe changes. The zip is kept on the run's page (Artifacts).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag to build (empty: this branch)"
        required: false
  push:
    branches: [main]
    paths: ["release/**", "release.py", ".github/workflows/windows-build.yml"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The build tools from this commit, the game from the commit asked for
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: .release-work/source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tools
        run: python -m pip install --disable-pip-version-check -r release/requirements.txt

      - name: Build and zip
        run: python release/build.py --source .release-work/source --version test --out dist

      - name: Play it
        shell: pwsh
        run: |
          # Before 0.9 the game saved nothing
          $saves = [bool](Get-ChildItem -Recurse -File -Include *.py .release-work/source | Select-String -Pattern "APPDATA" -List | Select-Object -First 1)
          $old = -not $saves
          ./release/try-build.ps1 -Zip dist/Hu-Taong-test-windows.zip -NoSave:$old

      # If it didn't start, a build with a console shows why
      - name: Why it failed
        if: failure()
        shell: pwsh
        env:
          HUTAONG_CONSOLE: "1"
          SDL_AUDIODRIVER: dummy
        run: |
          python release/build.py --source .release-work/source --version console --out console
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata"
          $out = Join-Path $env:RUNNER_TEMP "game.log"
          $game = Start-Process -FilePath "console\Hu Taong\Hu Taong.exe" -WorkingDirectory "console\Hu Taong" `
            -RedirectStandardOutput $out -RedirectStandardError "$out.err" -PassThru
          if (-not $game.WaitForExit(25000)) { Stop-Process $game -Force }
          Get-Content $out -Tail 40 -ErrorAction SilentlyContinue
          Get-Content "$out.err" -Tail 60 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Hu-Taong-windows
          path: dist/Hu-Taong-test-windows.zip
          retention-days: 7
