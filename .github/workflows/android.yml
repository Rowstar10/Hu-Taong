name: Android

# Builds Hu Taong's Android APK, plays it on an Android emulator, and, for a tag like
# v1.5-android, publishes it as that tag's release (which Toki Hub installs from).
on:
  push:
    branches: [main, claude/android]
    tags: ["v*-android"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a build still running
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  P4A_VERSION: "2026.5.9"
  NDK_VERSION: "28.2.13676358"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tools
        timeout-minutes: 20
        run: |
          # The runner has the build tools but libltdl-dev, whose libtool macros (ltdl.m4) libffi
          # needs. Ubuntu's package mirror can be slow or unreachable from the runners, so the
          # macros come from libtool's own source instead (2.4.7, the runner's libtool); ffmpeg
          # for the music comes from PyPI (imageio-ffmpeg)
          if [[ ! -f /usr/share/aclocal/ltdl.m4 ]]; then
            for site in https://ftpmirror.gnu.org https://ftp.gnu.org/gnu; do
              curl -fsSL --retry 3 --max-time 120 "$site/libtool/libtool-2.4.7.tar.gz" \
                | tar xz -C "$RUNNER_TEMP" libtool-2.4.7/m4/ltdl.m4 && break
            done
            sudo cp "$RUNNER_TEMP/libtool-2.4.7/m4/ltdl.m4" /usr/share/aclocal/
          fi
          for tool in autoconf automake libtoolize pkg-config zip unzip; do command -v $tool > /dev/null || echo "::warning::$tool is missing"; done
          pip install -q "python-for-android==$P4A_VERSION" "cython>=3.1" setuptools pygame==2.6.1 imageio-ffmpeg
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          (yes || true) | "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" | grep -v "^\[" | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Tests (the PC game, and the phone's controls on a PC)
        run: python -m unittest discover -s tests -t .
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v*-android ]]; then
            v="${GITHUB_REF_NAME#v}"; v="${v%-android}"
          else
            v="$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Hu Taong $v"

      # python-for-android's finished build of Python, SDL and pygame, so later runs only pack the game
      - uses: actions/cache@v4
        with:
          path: |
            /home/runner/p4a/dists
            /home/runner/p4a/packages
          key: p4a-${{ env.P4A_VERSION }}-${{ env.NDK_VERSION }}-${{ steps.version.outputs.version }}-${{ hashFiles('android/recipes/**', 'android/build.sh') }}

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/toki.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/toki.p12" >> "$GITHUB_ENV"
            echo "Signing with your key"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: this APK is signed with a throwaway debug key"
          fi

      - name: Build the APK
        run: android/build.sh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          P4A_STORAGE: /home/runner/p4a
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/toki.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist/*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play it on an emulated phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: android/smoke-test.sh "$(ls dist/*.apk | head -1)" build/android-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: build/android-test

  release:
    needs: [build, emulator]
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-android')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: A release needs your signing key
        env:
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets, then run this again: an APK signed with a throwaway key couldn't be updated later"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          v="${tag#v}"; v="${v%-android}"
          notes="Hu Taong $v for Android phones and tablets (Android 7 or later). Install it from Toki Hub, or open the APK on your phone. It plays online with Hu Taong $v on a PC."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk --clobber
          else
            gh release create "$tag" dist/*.apk --title "Hu Taong $v for Android" --notes "$notes" --latest=false
          fi
