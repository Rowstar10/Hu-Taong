name: Android

# Builds Hu Taong's Android APK, plays it on an Android emulator, and for a version's tag (v1.7)
# publishes it on that tag's release, which Toki Hub installs from. Every new version tag does
# this by itself.
#
# To publish a version that's already tagged, run this workflow by hand (Actions > Android > Run
# workflow) with the tag, and optionally the commit to build if that version's Android-ready code
# isn't the tag itself (1.5's is its hit-fix update, 0e742ec). It never makes tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish the APK on, like v1.6"
        required: true
      ref:
        description: "Commit to build (leave empty to build the tag)"
        required: false

permissions:
  contents: write

# A newer push to the same branch (or for the same tag) replaces a build still running
concurrency:
  group: android-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  P4A_VERSION: "2026.5.9"
  NDK_VERSION: "28.2.13676358"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What to build
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          tag=""; ref="$GITHUB_SHA"
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"; ref="${INPUT_REF:-$INPUT_TAG}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null || { echo "::error::There is no tag $tag"; exit 1; }
            [[ "$tag" =~ ^v[0-9][0-9.]*(-android)?$ ]] || { echo "::error::$tag isn't a version tag like v1.7"; exit 1; }
            version="${tag#v}"; version="${version%-android}"
          fi
          sha="$(git rev-parse "$ref^{commit}")"
          if [[ -z "$tag" ]]; then
            version="$(git show "$sha:CHANGELOG.md" | sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' | head -1)"
          fi
          git cat-file -e "$sha:core/platform.py" 2>/dev/null || { echo "::error::$ref has no Android version of the game (it's older than 1.5's Android update)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Hu Taong $version from ${sha:0:10}${tag:+, for the release on $tag}"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0

      # The game as it was at that version, built with today's Android tools
      - name: Android tools from this workflow's commit
        run: git checkout "$GITHUB_SHA" -- android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tools
        timeout-minutes: 20
        run: |
          # The runner has the build tools but libltdl-dev, whose libtool macros (ltdl.m4) libffi
          # needs. Ubuntu's package mirror can be slow or unreachable from the runners, so the
          # macros come from libtool's own source instead (2.4.7, the runner's libtool); ffmpeg
          # for the music comes from PyPI (imageio-ffmpeg)
          if [[ ! -f /usr/share/aclocal/ltdl.m4 ]]; then
            for site in https://ftpmirror.gnu.org https://ftp.gnu.org/gnu; do
              curl -fsSL --retry 3 --max-time 120 "$site/libtool/libtool-2.4.7.tar.gz" \
                | tar xz -C "$RUNNER_TEMP" libtool-2.4.7/m4/ltdl.m4 && break
            done
            sudo cp "$RUNNER_TEMP/libtool-2.4.7/m4/ltdl.m4" /usr/share/aclocal/
          fi
          for tool in autoconf automake libtoolize pkg-config zip unzip; do command -v $tool > /dev/null || echo "::warning::$tool is missing"; done
          pip install -q "python-for-android==$P4A_VERSION" "cython>=3.1" setuptools pygame==2.6.1 imageio-ffmpeg
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          (yes || true) | "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" | grep -v "^\[" | tail -5
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Tests (the PC game, and the phone's controls on a PC)
        run: python -m unittest discover -s tests -t .
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      # python-for-android's downloads (its finished build can't be kept: it points into build
      # folders that are far too big to cache)
      - uses: actions/cache@v4
        with:
          path: /home/runner/p4a/packages
          key: p4a-downloads-${{ env.P4A_VERSION }}-${{ hashFiles('android/recipes/**') }}
          restore-keys: p4a-downloads-${{ env.P4A_VERSION }}-

      - name: Signing key
        id: key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/toki.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/toki.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing with your key"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE secret: this APK is signed with a throwaway debug key"
          fi

      - name: Build the APK
        run: android/build.sh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          P4A_STORAGE: /home/runner/p4a
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Maven Central sometimes answers "too many requests" when several builds run at once:
          # Gradle tries again, waiting longer each time
          GRADLE_OPTS: -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000

      - name: Forget the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/toki.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist/*.apk
          if-no-files-found: error

  emulator:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0

      - name: Android tools from this workflow's commit
        run: git checkout "$GITHUB_SHA" -- android

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Where this version's buttons are, from the game itself
      - name: Where the buttons are
        run: |
          pip install -q pygame==2.6.1
          mkdir -p build
          python android/ui_positions.py build/positions.json

      - uses: actions/download-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play it on an emulated phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: android/smoke-test.sh "$(ls dist/*.apk | head -1)" build/positions.json build/android-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: build/android-test

  release:
    needs: [plan, build, emulator]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: A release needs your signing key
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          if [[ "$SIGNED" != "true" ]]; then
            echo "::error::This run's APK was signed with a throwaway key. Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets, then use Re-run all jobs (so the APK is rebuilt with your key)"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Hu-Taong-android
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF: ${{ needs.plan.outputs.ref }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          repo="$GITHUB_REPOSITORY"
          tagged="$(gh api "repos/$repo/commits/$TAG" --jq .sha)"
          notes="Hu Taong $VERSION for Android phones and tablets (Android 7 or later): install it from Toki Hub, or download the APK below and open it on your phone. It plays online with Hu Taong $VERSION on a PC."
          if [[ "$tagged" != "$REF" ]]; then
            notes="$notes"$'\n\n'"Built from ${REF:0:10}, $VERSION's Android-ready update."
          fi
          if gh release view "$TAG" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$repo" --clobber
          else
            gh release create "$TAG" dist/*.apk --repo "$repo" --verify-tag --title "Hu Taong $VERSION" --notes "$notes"
          fi
